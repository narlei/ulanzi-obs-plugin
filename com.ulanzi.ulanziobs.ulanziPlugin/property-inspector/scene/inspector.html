<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover" />
  <title>Scene</title>
  <link rel="stylesheet" href="../../libs/css/uspi.css">
  <style>
    .uspi-item-label { width: 112px; }
  </style>
</head>

<body>
  <div class="udpi-wrapper hidden uspi-wrapper">
    <form id="property-inspector">
      <!-- (1) Scene: populated live from the OBS scene list the plugin relays. -->
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Scene</div>
        <select class="uspi-item-value select" id="scene" name="scene"></select>
      </div>

      <!-- (2) Target: Preview vs Program (Output). -->
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Target</div>
        <select class="uspi-item-value select" id="target" name="target">
          <option value="preview" data-localize>Preview</option>
          <option value="output" data-localize>Output</option>
        </select>
      </div>

      <!-- (3) Icon: face family (monitor / camera / webcam) — matches scene_<icon>_* PNGs. -->
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Icon</div>
        <select class="uspi-item-value select" id="icon" name="icon">
          <option value="monitor" data-localize>Monitor</option>
          <option value="camera" data-localize>Camera</option>
          <option value="webcam" data-localize>Webcam</option>
        </select>
      </div>

      <div class="uspi-item-note tip info" data-localize>
        In Studio Mode Preview sets the next scene; Output cuts Program directly.
      </div>
    </form>
  </div>

  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
  <script>
    // Scene Property Inspector — three controls persisted as { scene, target, icon }.
    //
    //   (1) scene  — the OBS scene name, chosen from the LIVE scene list the plugin relays.
    //   (2) target — 'preview' | 'output'  (Studio-Mode Preview vs. direct Program cut).
    //   (3) icon   — 'monitor' | 'camera' | 'webcam'  (which scene_<icon>_* face family paints).
    //
    // Scene-list handshake (cribbed from the settings roundtrip already wired in this repo):
    //   - On connect the PI REQUESTS the live list from the main service. The service owns
    //     it via ObsClient.getAllScenes() (primed by GetSceneList — see plugin/obs/ObsClient.js).
    //   - The service RELAYS the list back; we populate the <select> from whichever wrapper
    //     the host delivers it in (sendToPropertyInspector -> payload, or an echoed param).
    //   - Settings persist back on every change via sendParamFromPlugin -> onParamFromPlugin
    //     -> app.js applySettings -> SceneAction.updateSettings({ scene, target, icon }).
    let ACTION_SETTING = {};
    let form = '';
    let sceneEl = '';

    $UD.connect();

    $UD.onConnected(() => {
      form = document.querySelector('#property-inspector');
      sceneEl = document.querySelector('#scene');
      document.querySelector('.udpi-wrapper').classList.remove('hidden');

      // Persist { scene, target, icon } to the plugin on any change.
      form.addEventListener(
        'input',
        Utils.debounce(async () => {
          ACTION_SETTING = Utils.getFormValue(form);
          $UD.sendParamFromPlugin(ACTION_SETTING);
        })
      );

      // Ask the main service for the live scene list (populate handshake).
      requestScenes();
    });

    // Host restore / plugin echo of saved settings.
    $UD.onAdd((jsn) => {
      if (jsn && jsn.param) hydrate(jsn.param);
      requestScenes();
    });
    $UD.onParamFromApp((jsn) => { if (jsn && jsn.param) hydrate(jsn.param); consumeScenes(jsn); });
    $UD.onParamFromPlugin((jsn) => { if (jsn && jsn.param) hydrate(jsn.param); consumeScenes(jsn); });

    // Main service relays the live scene list here.
    $UD.onSendToPropertyInspector?.((jsn) => consumeScenes(jsn));

    // Request the current OBS scene list from the main service. The service replies by
    // relaying getAllScenes() back to the PI (populate handshake).
    function requestScenes() {
      const req = { action: 'getScenes' };
      // sendToPlugin: pass-through request to the main service (not persisted).
      $UD.sendToPlugin?.(req);
      // Belt-and-suspenders: also flag it on the persisted-param channel the plugin already
      // listens on (onParamFromPlugin), so a service that only wires that path still answers.
      $UD.sendParamFromPlugin?.(Object.assign({}, ACTION_SETTING, req));
    }

    // Pull a scene list out of whatever wrapper the host delivered (payload | param | settings).
    function consumeScenes(jsn) {
      if (!jsn) return;
      const bag = jsn.payload || jsn.param || jsn.settings || {};
      if (Array.isArray(bag.scenes)) populateScenes(bag.scenes);
    }

    function hydrate(params) {
      ACTION_SETTING = params || {};
      Utils.setFormValue(ACTION_SETTING, form);
      // Keep the current scene selectable even before the live list arrives.
      ensureCurrentSceneOption();
    }

    // Populate the scene <select> from the live list; accepts either bare strings
    // ["Cam 1", ...] or { value, label } objects (the shape the stub relayed).
    function populateScenes(scenes) {
      if (!sceneEl) return;
      const current = ACTION_SETTING.scene;
      sceneEl.innerHTML = '';
      for (const s of scenes) {
        const value = typeof s === 'string' ? s : (s.value != null ? s.value : '');
        const label = typeof s === 'string' ? s : (s.label || s.value || '');
        if (value === '') continue;
        const o = document.createElement('option');
        o.value = value;
        o.textContent = label;
        if (value === current) o.selected = true;
        sceneEl.appendChild(o);
      }
      ensureCurrentSceneOption();
    }

    // If a saved scene isn't in the live list yet (list not arrived, or scene renamed),
    // keep it as a selectable option so the PI never silently drops the user's choice.
    function ensureCurrentSceneOption() {
      if (!sceneEl) return;
      const current = ACTION_SETTING.scene;
      if (!current) return;
      const exists = Array.from(sceneEl.options).some((o) => o.value === current);
      if (!exists) {
        const o = document.createElement('option');
        o.value = current;
        o.textContent = current;
        sceneEl.insertBefore(o, sceneEl.firstChild);
      }
      sceneEl.value = current;
    }
  </script>
</body>

</html>
